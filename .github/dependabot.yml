version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Dependabot reads the root pnpm-workspace.yaml and would open PRs for
    # every workspace's dependencies. Suppress updates that are exclusive to
    # `website/` (Gatsby docs site, not published) and `benchmarks/` (private
    # comparison harness) so PRs focus on the npm-published packages under
    # `packages/*` and their shared build tooling at the repo root.
    ignore:
      # website/ only
      - dependency-name: gatsby
      - dependency-name: gatsby-*
      - dependency-name: smooth-doc
      - dependency-name: prismjs
      # benchmarks/ only
      - dependency-name: '@emotion/core'
      - dependency-name: emotion-theming
      - dependency-name: styled-system
      - dependency-name: benchmark
      - dependency-name: babel-loader
      - dependency-name: html-webpack-plugin
      - dependency-name: webpack
      - dependency-name: webpack-cli
      - dependency-name: webpack-dev-server
    groups:
      babel:
        patterns:
          - '@babel/*'
          - 'babel-*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - 'babel-jest'
          - '@types/jest'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      rollup:
        patterns:
          - 'rollup'
          - 'rollup-plugin-*'
      emotion:
        patterns:
          - '@emotion/*'
      testing-library:
        patterns:
          - '@testing-library/*'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/react'
          - '@types/react-dom'
          - '@types/jest'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
